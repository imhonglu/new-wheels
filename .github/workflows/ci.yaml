name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and docs
        run: |
          pnpm cspell --no-summary --no-progress .
          pnpm biome ci .
          pnpm run check:docs

      - name: Build packages
        run: pnpm run build

      - name: Test affected packages
        run: |
          if git diff --quiet HEAD^1 -- package.json pnpm-lock.yaml pnpm-workspace.yaml vitest.config.ts .github/workflows/ci.yaml; then
            pnpm \
              --filter="...[HEAD^1]" \
              --filter="!@imhonglu/new-wheels" \
              --test-pattern="**/*.test.ts" \
              --changed-files-ignore-pattern="**/*.md" \
              --if-present run test -- --run
          else
            pnpm vitest --run
          fi

      - name: Test affected JSON Schema conformance
        run: |
          if git diff --quiet HEAD^1 -- package.json pnpm-lock.yaml pnpm-workspace.yaml vitest.config.ts .github/workflows/ci.yaml; then
            pnpm \
              --filter="...[HEAD^1]" \
              --filter="!@imhonglu/new-wheels" \
              --test-pattern="**/*.test.ts" \
              --changed-files-ignore-pattern="**/*.md" \
              --changed-files-ignore-pattern="tools/json-schema-conformance/src/**/*.test.ts" \
              --if-present run test:conformance
          else
            pnpm --filter @imhonglu/json-schema-conformance test:conformance
          fi
